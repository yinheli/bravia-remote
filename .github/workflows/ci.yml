name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# Pin the runner image: `ubuntu-latest` migrated to Ubuntu 26.04 in Nov 2026.
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check
      - run: bun run test
      - run: bun run build:server
      - run: bun run smoke
