<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <!-- style-src omits 'unsafe-inline': React writes dynamic styles (the volume
         bars) through the CSSOM, which CSP allows; markup style attributes and
         injected <style> elements stay blocked. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    >
    <title>BRAVIA Remote</title>
    <link rel="stylesheet" href="./app.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="./app.js"></script>
  </body>
</html>
